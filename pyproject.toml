[project]
name = "university-chatbot-data-collection"
version = "0.1.0"
description = "Data collection stage for university regulation RAG chatbot"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "easyocr>=1.7.0",
    "pillow>=10.0.0",
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htguide"]
